# zstd and zstd-safe are in Cargo.lock only through optional features that
# nothing enables: foundry-primitives -> tempo-primitives (git) -> reth-codecs
# (optional `reth-codec` feature, off) -> reth-zstd-compressors (optional
# `alloy` feature, off) -> zstd -> zstd-safe. None of reth-codecs, zstd or
# zstd-safe is in the compiled graph: `cargo tree -i zstd --target all -e all`
# prints nothing, and cargo-deny never sees them. reth pins zstd 0.13, so the
# fixed zstd 0.14 / zstd-safe 8.x line is unreachable without modifying reth.
# Pinned to exact versions so any bump is re-audited.
[[PackageOverrides]]
name = "zstd"
version = "0.13.3"
ecosystem = "crates.io"
ignore = true
reason = "not in the compiled graph: behind unused optional features of tempo-primitives/reth-codecs (foundry git deps); reth pins zstd 0.13 so the fixed 0.14 line is unreachable"

[[PackageOverrides]]
name = "zstd-safe"
version = "7.2.4"
ecosystem = "crates.io"
ignore = true
reason = "not in the compiled graph: pulled only by zstd 0.13.3 (see above); fixed 8.x line requires zstd 0.14, which reth does not allow"
