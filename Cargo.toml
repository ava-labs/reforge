[package]
name = "reforge"
version = "0.1.0"
edition = "2024"
authors = ["Ava Labs, Inc. <contact@avalabs.org>"]
description = "A forge wrapper that adds Solidity macro preprocessing"
repository = "https://github.com/ava-labs/reforge"
homepage = "https://github.com/ava-labs/reforge"
readme = "README.md"
keywords = ["solidity", "forge", "foundry", "macros", "evm"]
categories = ["development-tools", "command-line-utilities"]
rust-version = "1.91.0"
license = "MIT"

[dependencies]
alloy-primitives = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.0", features = ["derive"] }
comfy-table = "7.2"
eyre = "0.6.12"
forge = { path = "foundry/crates/forge" }
forge-fmt = { path = "foundry/crates/fmt" }
forge-lint = { path = "foundry/crates/lint" }
foundry-cli = { path = "foundry/crates/cli" }
foundry-common = { path = "foundry/crates/common" }
foundry-compilers = { version = "0.19.14", default-features = false }
foundry-config = { path = "foundry/crates/config" }
foundry-debugger = { path = "foundry/crates/debugger" }
foundry-evm = { path = "foundry/crates/evm/evm" }
glob = "0.3"
inferno = { version = "0.12", default-features = false }
itertools = "0.14"
libc = "0.2"
opener = "0.8"
quick-junit = "0.5"
rayon = "1.12"
regex = "1.12.3"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
solar = { package = "solar-compiler", version = "=0.1.8", default-features = false }
soldeer-core = { version = "=0.10.0", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
yansi = "1.0"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Lower the priority of the lint groups so the specific entries below override them.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the crate's structure rather than pointing at real
# problems:
# - the CLI arg structs mirror foundry's flags, and `Option<Option<PathBuf>>` is
#   how clap models an optional-value flag such as `--diff [FILE]`.
# - macro rules must match the `Macro` fn-pointer signature, so they cannot drop
#   the `Result` even when they never fail.
# - the last two push toward backwards-incompatible signature changes for little
#   gain (both are allowed in firewood for the same reason).
struct_excessive_bools = "allow"
option_option = "allow"
unnecessary_wraps = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
absolute-paths = "warn"
arithmetic-side-effects = "warn"
indexing-slicing = "warn"

[patch.crates-io]
## solar
solar = { package = "solar-compiler", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
solar-interface = { package = "solar-interface", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
solar-ast = { package = "solar-ast", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
solar-sema = { package = "solar-sema", git = "https://github.com/paradigmxyz/solar", rev = "530f129" }
