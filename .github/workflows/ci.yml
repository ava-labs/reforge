name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Example (macros)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .gitmodules URLs and initialise submodules
        run: bash .github/scripts/validate-submodules.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.91.0"

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run example test suite
        run: make test

      - name: Run example coverage smoke test
        run: make coverage

      - name: Run example snapshot smoke test
        run: make snapshot

      - name: Save cargo cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .gitmodules URLs and initialise submodules
        run: bash .github/scripts/validate-submodules.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.91.0"
          components: clippy

      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        run: make clippy

      - name: Save cargo cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .gitmodules URLs and initialise submodules
        run: bash .github/scripts/validate-submodules.sh

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run cargo deny (RustSec)
        run: make deny

      - name: Install osv-scanner
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.3.2/osv-scanner_linux_amd64 \
            -o /usr/local/bin/osv-scanner
          echo "03d800073a330d053047b26ff4484136d866aee4f486e12fb82aa452bd4002ca  /usr/local/bin/osv-scanner" \
            | sha256sum -c
          chmod +x /usr/local/bin/osv-scanner

      - name: Run osv-scanner (OSV.dev)
        run: make osv

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate .gitmodules URLs and initialise submodules
        run: bash .github/scripts/validate-submodules.sh

      - name: Read nightly toolchain version
        id: nightly
        run: |
          version=$(cat nightly-toolchain)
          if ! [[ "$version" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid nightly toolchain version: $version" >&2
            exit 1
          fi
          delimiter=$(openssl rand -hex 16)
          echo "version<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "${version}"           >> "$GITHUB_OUTPUT"
          echo "${delimiter}"         >> "$GITHUB_OUTPUT"

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.nightly.outputs.version }}
          components: rustfmt

      - name: Install taplo
        run: cargo install taplo-cli --version 0.10.0 --locked

      - name: Install cargo-sort
        run: cargo install cargo-sort --version 2.1.4 --locked

      - name: Check formatting
        run: make fmt-check