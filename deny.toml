[advisories]
version = 2
ignore = [
    # paste: unmaintained (dtolnay archived). Compile-time proc-macro only —
    # no runtime attack surface. No fix available upstream.
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro, no runtime surface, no fix available" },

    # quick-xml: both advisories are reader-side (quadratic blowup in
    # BytesStart::attributes and NsReader namespace allocation). reforge only
    # ever writes XML/SVG — no Reader/NsReader call sites exist in src/.
    { id = "RUSTSEC-2026-0194", reason = "reader-side DoS; reforge only writes XML, never calls Reader/NsReader" },
    { id = "RUSTSEC-2026-0195", reason = "reader-side DoS; reforge only writes XML, never calls Reader/NsReader" },

    # proc-macro-error2: unmaintained. Compile-time proc-macro crate only —
    # no runtime attack surface. Transitively required by foundry.
    { id = "RUSTSEC-2026-0173", reason = "compile-time proc-macro, no runtime surface; transitively required by foundry" },

    # zip-extract: unmaintained (archived Sep 2025). Locked by soldeer-core in
    # foundry submodule — we don't control the dependency. Extraction logic is
    # unchanged; no security vulnerability, only a maintenance advisory.
    { id = "RUSTSEC-2025-0172", reason = "unmaintained; locked by soldeer-core in foundry submodule; no security vulnerability, maintenance-only advisory" },

    # Three zip advisories (SUID/SGID, symlink path traversal, perms through
    # symlinks) all require zip >= 9.0.0. soldeer-core 0.10.0 (foundry
    # submodule, unmodifiable) pins zip 4.6.1; soldeer-core 0.12.0 (our dep)
    # pulls zip 8.6.0 — neither allows 9.x yet.  All three vectors require
    # extraction of an attacker-controlled archive; soldeer only extracts
    # archives from its own registry after checksum verification, so the
    # attack surface doesn't exist in practice.
    { id = "RUSTSEC-2026-0367", reason = "zip 9.x not yet available via soldeer-core; soldeer only extracts checksum-verified registry archives, not attacker-controlled input" },
    { id = "RUSTSEC-2026-0368", reason = "zip 9.x not yet available via soldeer-core; soldeer only extracts checksum-verified registry archives, not attacker-controlled input" },
    { id = "RUSTSEC-2026-0369", reason = "zip 9.x not yet available via soldeer-core; soldeer only extracts checksum-verified registry archives, not attacker-controlled input" },

    # crypto-bigint 0.5.x: timing side channels in arithmetic meant to be
    # constant-time. The fix (>= 0.7.6) is a semver-major jump that needs
    # elliptic-curve 0.14 / k256 0.14, but every alloy-signer release so far
    # (including 2.x) still requires k256 ^0.13, and foundry pins alloy.
    # reforge is a local developer CLI: the only signing it does is through
    # foundry cheatcodes/scripts with keys the developer supplies.
    { id = "RUSTSEC-2026-0387", reason = "fix requires crypto-bigint 0.7 / k256 0.14; every alloy-signer release still pins k256 ^0.13 and foundry pins alloy; local developer CLI signing only with developer-supplied keys" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC-BY-4.0",
    "CC0-1.0",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # foundry submodule transitive git deps
    "https://github.com/tempoxyz/tempo",
    "https://github.com/paradigmxyz/solar",
]