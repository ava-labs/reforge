[advisories]
ignore = [
    # paste: unmaintained (dtolnay archived). Compile-time proc-macro only —
    # no runtime attack surface. No fix available upstream.
    "RUSTSEC-2024-0436",

    # quick-xml: both advisories are reader-side DoS. reforge only writes
    # XML/SVG — no Reader/NsReader call sites exist in src/.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # rustls-webpki: requires RevocationOptions + attacker-controlled CRLs.
    # Default rustls config does not enable CRL checking.
    "RUSTSEC-2026-0104",

    # proc-macro-error2: unmaintained. Compile-time proc-macro only.
    "RUSTSEC-2026-0173",
]

[output]
deny = ["unsound", "yanked"]
warn = ["unmaintained", "notice", "informational"]